<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="/style.css" />
    <title>Hello World!</title>
  </head>
  <!-- Обязательно добавляем класс connect-page, чтобы текст оставался черным! -->
  <body style="height: 800px" class="connect-page">
    <header class="header">
      <div class="header__container">
        <nav class="header__nav">
          <img class="header__logo" src="images/favicon.png" alt="Логотип" />
          <ul class="header__list">
            <li class="header__list-item">
              <a class="header__list-link" href="/index.html">Дом</a>
            </li>
            <li class="header__list-item">
              <a class="header__list-link" href="/image.html">Изображение</a>
            </li>
            <li class="header__list-item">
              <a class="header__list-link" href="/MyProjects.html"
                >Мои Проекты</a
              >
            </li>
            <li class="header__list-item">
              <a class="header__list-link active" href="/Community.html"
                >Мои взгляды и сообщество</a
              >
            </li>
          </ul>
          <!-- Добавили класс active, так как это страница связи -->
          <a class="header__button active" href="/connect.html">Связь</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero__container">
          <!-- Верхняя часть: Текст слева, Видео справа -->
          <div class="hero__main-content">
            <!-- Левая колонка с текстом -->
            <div class="hero__text-block">
              <h1 class="hero__title">?</h1>
              <p class="hero__desc">
                Проект который не сбудиться в ближайшие 30 лет
              </p>
            </div>

            <!-- Правая колонка с видео (замени URL на свое видео) -->
            <div class="hero__video-block">
              <iframe
                src="https://www.youtube.com/embed/Yb5ivvcTvRQ"
                title="YouTube video player"
                frameborder="0"
                allow="
                  accelerometer;
                  autoplay;
                  clipboard-write;
                  encrypted-media;
                  gyroscope;
                  picture-in-picture;
                "
                allowfullscreen
              >
              </iframe>
            </div>
          </div>

          <!-- Ниже: Блок с твоими гифками -->
          <div class="hero__gifs">
            <img src="images/Scherzo.gif" alt="Scherzo" class="gif-item" />
            <img
              src="images/cheese.gif"
              alt="Cheese"
              class="gif-item gif-item--small"
            />
          </div>
        </div>
      </section>
    </main>
    <!-- Скрипт переключения гифки -->
    <script>
      const logo = document.querySelector(".header__logo");

      logo.addEventListener("click", function () {
        document.body.classList.toggle("bg-active");
      });
    </script>
  </body>
</html>
