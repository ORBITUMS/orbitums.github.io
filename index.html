<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="/style.css" />
    <title>Hello World!</title>
  </head>
  <!-- На главной странице добавляем класс home-page -->
  <body class="home-page">
    <header class="header">
      <div class="header__container">
        <nav class="header__nav">
          <img class="header__logo" src="images/favicon.png" alt="Логотип" />
          <ul class="header__list">
            <li class="header__list-item">
              <a class="header__list-link active" href="/index.html">Дом</a>
            </li>
            <li class="header__list-item">
              <a class="header__list-link" href="/image.html">Изображение</a>
            </li>
            <li class="header__list-item">
              <a class="header__list-link" href="/MyProjects.html"
                >Мои Проекты</a
              >
            </li>
            <li class="header__list-item">
              <a class="header__list-link" href="/Community.html">Сообщество</a>
            </li>
          </ul>
          <a class="header__button" href="/connect.html">Связь</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero__container">
          <div class="hero__content">
            <div class="hero__text">
              <h1 class="hero__title">Этот сайт обо мне</h1>
              <p class="hero__desc"><b>был создан 30 августа 2026</b></p>
            </div>
          </div>
          <img class="hero__image" src="/images/tenor.gif" alt="" />
        </div>
      </section>
    </main>
    <script>
      const logo = document.querySelector(".header__logo");

      logo.addEventListener("click", function () {
        document.body.classList.toggle("bg-active");
      });
    </script>
  </body>
</html>
